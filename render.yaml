services:
  - type: web
    name: vibetube-api
    runtime: node
    plan: free
    region: singapore
    rootDir: apps/api
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_REGION
        sync: false
      - key: R2_BUCKET_NAME
        value: vibetube-media
  - type: web
    name: vibetube-web
    runtime: node
    plan: free
    region: singapore
    rootDir: apps/web
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /age-check
    envVars:
      - key: API_INTERNAL_URL
        sync: false
